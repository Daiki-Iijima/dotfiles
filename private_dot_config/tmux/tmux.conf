# =============================================================
# Prefix
# =============================================================
unbind C-b
set -g prefix C-s
bind C-s send-prefix    # Ctrl+s Ctrl+s でアプリにそのまま送れる


# =============================================================
# 基本設定
# =============================================================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # True Color
set -g base-index 1           # ウィンドウ番号を 1 スタート
setw -g pane-base-index 1     # ペイン番号を 1 スタート
set -g renumber-windows on    # ウィンドウを閉じたとき番号を詰める
set -g escape-time 0          # Esc の遅延をなくす（nvim 用）
set -g focus-events on        # nvim の autoread に必要
set -s extended-keys always   # Ctrl+Enter 等の CSI u 拡張キーを nvim に透過（Ghostty の terminfo が extkeys 未宣言のため常時有効化）
set -g history-limit 50000
set -sg repeat-time 300       # キーリピートの猶予


# =============================================================
# キーバインド
# =============================================================
# 設定リロード
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# 日本語ヘルプ表示（デフォルトの ? を上書き）
bind ? display-popup -E -w 80 -h 45 "LESSKEY=~/.config/tmux/less.bin less ~/.config/tmux/help-ja.txt"

# ペイン分割（直感的なキーに変更）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新ウィンドウを現在のパスで開く
bind c new-window -c "#{pane_current_path}"

# Prefix + h/j/k/l で、その方向に新規ペインを作成
bind h split-window -h -b -c "#{pane_current_path}"
bind l split-window -h -c "#{pane_current_path}"
bind k split-window -v -b -c "#{pane_current_path}"
bind j split-window -v -c "#{pane_current_path}"

# Prefix + Backspace で現在のペインを閉じる
bind BSpace kill-pane

# ペインの入れ替え（スワップ）を Prefix + Ctrl + h/j/k/l に割り当て
bind C-h swap-pane -t '{left-of}'
bind C-j swap-pane -t '{bottom-of}'
bind C-k swap-pane -t '{top-of}'
bind C-l swap-pane -t '{right-of}'

# vim-tmux-navigator: Ctrl+H/J/K/L でプレフィックスなしに nvim ↔ tmux をシームレス移動 (フォアグラウンドのみ判定)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+\\+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# ペインリサイズ（繰り返し可能）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ペインリサイズモード (Prefix + e でモード開始、hjkl または矢印キーでリサイズ、q/Enter/Esc で終了)
bind-key e switch-client -T resize-mode \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)"

# リサイズキー (1〜2セルずつ微調整)
bind-key -T resize-mode h resize-pane -L 2 \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode
bind-key -T resize-mode j resize-pane -D 1 \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode
bind-key -T resize-mode k resize-pane -U 1 \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode
bind-key -T resize-mode l resize-pane -R 2 \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode

# 大幅リサイズ (5〜10セルずつ調整)
bind-key -T resize-mode H resize-pane -L 10 \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode
bind-key -T resize-mode J resize-pane -D 5  \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode
bind-key -T resize-mode K resize-pane -U 5  \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode
bind-key -T resize-mode L resize-pane -R 10 \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode

# 矢印キーでも操作可能にする (1〜2セルずつ)
bind-key -T resize-mode Left  resize-pane -L 2 \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode
bind-key -T resize-mode Down  resize-pane -D 1 \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode
bind-key -T resize-mode Up    resize-pane -U 1 \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode
bind-key -T resize-mode Right resize-pane -R 2 \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode

# 矢印キーの大幅リサイズ (5〜10セルずつ)
bind-key -T resize-mode S-Left  resize-pane -L 10 \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode
bind-key -T resize-mode S-Down  resize-pane -D 5  \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode
bind-key -T resize-mode S-Up    resize-pane -U 5  \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode
bind-key -T resize-mode S-Right resize-pane -R 10 \; display-message " -- RESIZE MODE -- (h/j/k/l: resize, q/Enter/Esc: exit)" \; switch-client -T resize-mode

# 終了キー (q, Enter, Escape)
bind-key -T resize-mode q      display-message "Exit resize mode"
bind-key -T resize-mode Enter  display-message "Exit resize mode"
bind-key -T resize-mode Escape display-message "Exit resize mode"


# ratewatch ペインの表示/非表示をトグル切り替え
bind u run-shell "/Users/daiki/ratewatch/toggle.sh"

# マウス操作を有効化
set -g mouse on

# =============================================================
# ペイン外観（アクティブペインを強調）
# =============================================================
set -g pane-border-style "fg=#45475a"                    # 非アクティブ: 暗いグレー
set -g pane-active-border-style "fg=#89b4fa,bold"        # アクティブ: catppuccin blue

# 非アクティブなペインの背景色を少し暗くし、文字色を暗めのグレーにする
set -g window-style "fg=#6c7086,bg=#181825"
set -g window-active-style "fg=#cdd6f4,bg=#1e1e2e"

set -g pane-border-status top                            # ペイン上部にタイトルバーを表示
set -g pane-border-format "#{?pane_active,#[fg=#89b4fa bold]▶ #[fg=#cdd6f4],#[fg=#6c7086]  }#[italics]#{pane_current_command}#[default]  [#{pane_index}]"


# =============================================================
# コピーモード（Vi キーバインド）
# =============================================================
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel


# =============================================================
# プラグイン
# =============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'    # 汎用的なデフォルト設定
set -g @plugin 'tmux-plugins/tmux-resurrect'   # セッション保存・復元
set -g @plugin 'tmux-plugins/tmux-continuum'   # resurrect の自動保存
set -g @plugin 'tmux-plugins/tmux-yank'        # コピーモードでクリップボード連携
set -g @plugin 'catppuccin/tmux#v2.1.3'        # モダンなステータスバー
set -g @plugin 'sainnhe/tmux-fzf'              # fzf でセッション/ウィンドウ切替
set -g @plugin 'fcsonline/tmux-thumbs'         # 画面上のテキストをヒントキーで即コピー
# set -g @plugin 'christoomey/vim-tmux-navigator'

# resurrect 設定
set -g @resurrect-capture-pane-contents 'on'   # ペインの内容も保存
set -g @resurrect-strategy-nvim 'session'      # nvim セッションも復元

# continuum 設定
set -g @continuum-restore 'on'                 # 起動時に自動復元
set -g @continuum-save-interval '15'           # 15分ごとに自動保存

# catppuccin テーマ設定
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_text " #W"                    # 非アクティブ: 名前
set -g @catppuccin_window_current_text " #W"            # アクティブ: アイコン+名前
set -g @catppuccin_window_current_fill "all"            # アクティブをフルカラーで強調
set -g @catppuccin_window_current_color "#{@thm_lavender}"  # アクティブウィンドウを lavender に
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_modules_right "application session date_time"
set -g @catppuccin_date_time_text " %Y年%m月%d日(%a) %H:%M"

# tmux-thumbs 設定
set -g @thumbs-key T    # デフォルトの Space から T に変更（コピーモードと干渉しないように）
set -g @thumbs-command 'tmux set-buffer -- {} && echo -n {} | pbcopy'           # 小文字ヒント: コピーのみ
set -g @thumbs-upcase-command 'tmux set-buffer -- {} && echo -n {} | pbcopy && open {}'  # 大文字ヒント: コピー+open

# tmux-fzf 設定
TMUX_FZF_LAUNCH_KEY="f"     # Ctrl+s f でfzf起動

# =============================================================
# TPM 初期化（必ず末尾）
# =============================================================
run '~/.tmux/plugins/tpm/tpm'

# =============================================================
# ウィンドウステータス上書き（TPM・catppuccin より後に設定する必要あり）
# =============================================================
set -g window-status-separator ""
set -g window-status-format         "#[fg=#313244,bg=#1e1e2e]#[fg=#6c7086,bg=#313244] #I · #W #[fg=#313244,bg=#1e1e2e]"
set -g window-status-current-format "#[fg=#b4befe,bg=#1e1e2e]#[fg=#1e1e2e,bg=#b4befe,bold] ● #W #[fg=#b4befe,bg=#1e1e2e]"
