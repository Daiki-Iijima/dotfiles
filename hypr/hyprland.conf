# ─────────────────────────────────────────────
# Hyprland 設定 (Tokyo Night 統一)
# ─────────────────────────────────────────────

# モニタ (自動検出)
monitor = , preferred, auto, 1.0

# ─────────────────────────────────────────────
# 起動時に走らせるもの
# ─────────────────────────────────────────────
exec-once = waybar
exec-once = dunst
exec-once = hyprpaper
exec-once = ibus-daemon -drxR
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ─────────────────────────────────────────────
# 環境変数 (IM / デスクトップ識別子)
# ─────────────────────────────────────────────
env = GTK_IM_MODULE,ibus
env = QT_IM_MODULE,ibus
env = XMODIFIERS,@im=ibus
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# ─────────────────────────────────────────────
# 入力 (JIS キーボード)
# ─────────────────────────────────────────────
input {
    kb_layout = jp
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ─────────────────────────────────────────────
# 一般 (gaps / border)
# ─────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(7aa2f7) rgb(9d7cd8) 45deg
    col.inactive_border = rgba(414868aa)
    layout = dwindle
    resize_on_border = true
}

# ─────────────────────────────────────────────
# 装飾 (角丸 + ブラー + 影)
# ─────────────────────────────────────────────
decoration {
    rounding = 8
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(1a1b26ee)
    }
    active_opacity = 1.0
    inactive_opacity = 0.95
}

# ─────────────────────────────────────────────
# アニメーション
# ─────────────────────────────────────────────
animations {
    enabled = true
    bezier    = ease, 0.25, 0.46, 0.45, 0.94
    animation = windows,    1, 4, ease, slide
    animation = border,     1, 8, ease
    animation = fade,       1, 4, ease
    animation = workspaces, 1, 5, ease, slide
}

# ─────────────────────────────────────────────
# レイアウト
# ─────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ─────────────────────────────────────────────
# キーバインド ($mainMod = SUPER)
# ─────────────────────────────────────────────
$mainMod = SUPER

# 基本操作
bind = $mainMod, Q, exec, wezterm
bind = $mainMod, D, exec, fuzzel
bind = $mainMod, W, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, SPACE, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, T, togglesplit

# クリップボード履歴
bind = $mainMod, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# ロック / 終了メニュー
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, E, exec, wlogout

# スクショ (範囲選択 → swappy で編集 / 全画面 → クリップボード)
bind = $mainMod, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod SHIFT, S, exec, grim - | wl-copy

# フォーカス移動 (vim 風)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# ウィンドウ移動
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# ウィンドウサイズ調整
binde = $mainMod CTRL, h, resizeactive, -20 0
binde = $mainMod CTRL, l, resizeactive, 20 0
binde = $mainMod CTRL, k, resizeactive, 0 -20
binde = $mainMod CTRL, j, resizeactive, 0 20

# ワークスペース切替
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# ワークスペースに送る
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# マウスホイールでワークスペース移動
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# マウスドラッグ操作
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# 音量・明度・メディア
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous

# ─────────────────────────────────────────────
# ウィンドウルール (フローティング指定など)
# ─────────────────────────────────────────────
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, title:^(Picture-in-Picture)$
