background {
    monitor =
    color = rgba(1a1b26ff)
    blur_passes = 0
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    inner_color = rgba(1a1b26cc)
    outer_color = rgba(7aa2f7ff)
    check_color = rgba(9ece6aff)
    fail_color  = rgba(f7768eff)
    font_color  = rgba(c0caf5ff)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    rounding = 8
    position = 0, -100
    halign = center
    valign = center
}

# 大きな時計
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(c0caf5ff)
    font_size = 100
    font_family = JetBrains Mono Bold
    position = 0, 200
    halign = center
    valign = center
}

# 日付
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %B %d')"
    color = rgba(7aa2f7ff)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 80
    halign = center
    valign = center
}

# ユーザー名
label {
    monitor =
    text = $USER
    color = rgba(9d7cd8ff)
    font_size = 16
    font_family = JetBrains Mono
    position = 0, -50
    halign = center
    valign = center
}
